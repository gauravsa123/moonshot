name: Publish wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "scripts/build_skill_graph.py"
      - "scripts/build_skill_map.py"
      - "scripts/skill_graph_template.html"
      - ".github/workflows/publish-wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require main branch for publishing
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Pages can only be deployed from main. Select main for manual dispatch."
          exit 1

      - name: Build graph
        run: python3 scripts/build_skill_graph.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload wiki artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: wiki

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
